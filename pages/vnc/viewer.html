<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNC</title>
<style>
  :root {
    --bg: #0b0e17;
    --bar: rgba(22, 27, 43, .92);
    --text: #e8eaf2;
    --muted: #8b93ab;
    --line: #2a3050;
    --acc: #4f7cff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef1f8; --bar: rgba(255, 255, 255, .92); --text: #1b2030; --muted: #67708a; --line: #dfe4f2; }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
  }
  body {
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    display: flex; flex-direction: column;
  }
  #bar {
    flex: none; height: 28px; display: flex; align-items: center; gap: 6px;
    padding: 0 6px 0 8px; background: var(--bar);
    border-bottom: 1px solid var(--line); overflow: hidden;
  }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: #f7b955; flex: none; }
  #dot.ok { background: #39d98a; }
  #dot.err { background: #ff6b6b; }
  #status {
    color: var(--muted); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 42vw; flex: 0 1 auto;
  }
  .grow { flex: 1 1 auto; min-width: 4px; }
  button {
    appearance: none; height: 20px; padding: 0 7px; border-radius: 5px;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    font: inherit; line-height: 18px; cursor: pointer; white-space: nowrap; flex: none;
  }
  button:hover { border-color: var(--muted); }
  button.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  #zoomLabel { color: var(--muted); min-width: 34px; text-align: center; flex: none; }
  #screen {
    flex: 1 1 auto; min-height: 0; position: relative;
    background: var(--bg); overflow: hidden;
  }
  /* 适配模式：画布居中，留白与面板同色，看不到黑边 */
  #screen.fit { display: flex; align-items: center; justify-content: center; }
  #screen.grab { cursor: grab; }
  #screen.grab:active { cursor: grabbing; }
  #msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; padding: 20px; text-align: center; color: var(--muted);
    pointer-events: none;
  }
  #msg.hidden { display: none; }
  @media (max-width: 520px) {
    #status { max-width: 30vw; }
    .wide { display: none; }
  }
</style>
</head>
<body>
  <div id="bar">
    <i id="dot"></i>
    <span id="status">连接中…</span>
    <span class="grow"></span>
    <button id="btnFit" class="on">适应窗口</button>
    <button id="btnOut">−</button>
    <span id="zoomLabel">—</span>
    <button id="btnIn">+</button>
    <button id="btnOne" title="1:1 原始像素">1:1</button>
    <button id="btnCd" class="wide" title="发送 Ctrl+Alt+Del">CAD</button>
    <button id="btnFs" title="全屏">全屏</button>
    <button id="btnReconnect" title="断开并重连">重连</button>
  </div>
  <div id="screen" class="fit"></div>
  <div id="msg">正在连接 VNC…</div>

<script type="module">
import RFB from './core/rfb.js';

const screenEl = document.getElementById('screen');
const msgEl = document.getElementById('msg');
const dot = document.getElementById('dot');
const statusEl = document.getElementById('status');
const zoomLabel = document.getElementById('zoomLabel');
const btnFit = document.getElementById('btnFit');
const btnOne = document.getElementById('btnOne');
const btnIn = document.getElementById('btnIn');
const btnOut = document.getElementById('btnOut');
const btnCd = document.getElementById('btnCd');
const btnFs = document.getElementById('btnFs');
const btnReconnect = document.getElementById('btnReconnect');

const params = new URLSearchParams(location.search);
const host = params.get('host') || location.hostname;
const port = params.get('port') || '6080';
const path = params.get('path') || 'websockify';
const password = params.get('password') || '';
const viewOnly = params.get('view_only') === '1';

let rfb = null;
let mode = 'fit';          // fit | manual
let manualScale = 1;
let connected = false;

function setStatus(text, kind) {
  statusEl.textContent = text;
  dot.className = kind || '';
}

function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${proto}://${host}:${port}/${path.replace(/^\/+/, '')}`;
}

function fitScale() {
  if (!rfb || !rfb._fbWidth) return 1;
  const w = screenEl.clientWidth;
  const h = screenEl.clientHeight;
  if (!w || !h) return 1;
  return Math.min(w / rfb._fbWidth, h / rfb._fbHeight);
}

function paintZoom() {
  const s = mode === 'fit' ? fitScale() : manualScale;
  zoomLabel.textContent = Math.round(s * 100) + '%';
  btnFit.classList.toggle('on', mode === 'fit');
  btnOne.classList.toggle('on', mode === 'manual' && Math.abs(manualScale - 1) < 0.001);
  screenEl.classList.toggle('fit', mode === 'fit');
  screenEl.classList.toggle('grab', mode === 'manual' && manualScale > fitScale() + 0.001);
}

function applyFit() {
  mode = 'fit';
  if (rfb) {
    rfb.clipViewport = false;
    rfb.dragViewport = false;
    rfb.scaleViewport = true;
  }
  paintZoom();
}

function applyManual(scale) {
  if (!rfb) return;
  mode = 'manual';
  manualScale = Math.min(4, Math.max(0.1, scale));
  // 关闭自动缩放后 noVNC 会把 display.scale 复位成 1，因此顺序不能反
  rfb.scaleViewport = false;
  rfb.clipViewport = true;
  rfb.dragViewport = true;
  try { rfb._display.scale = manualScale; } catch (e) { /* 版本差异，忽略 */ }
  paintZoom();
}

function step(delta) {
  const base = mode === 'fit' ? fitScale() : manualScale;
  applyManual(Math.round((base + delta) * 100) / 100);
}

function connect() {
  connected = false;
  screenEl.innerHTML = '';
  msgEl.classList.remove('hidden');
  msgEl.textContent = '正在连接 VNC…';
  setStatus('连接中…');
  if (rfb) {
    try { rfb.disconnect(); } catch (e) {}
    rfb = null;
  }
  try {
    rfb = new RFB(screenEl, wsUrl(), { credentials: { password }, wsProtocols: ['binary'] });
  } catch (e) {
    setStatus('初始化失败', 'err');
    msgEl.textContent = '初始化失败：' + (e && e.message ? e.message : e);
    return;
  }

  rfb.addEventListener('connect', () => {
    connected = true;
    msgEl.classList.add('hidden');
    setStatus(`已连接 ${rfb._fbWidth}×${rfb._fbHeight}`, 'ok');
    if (mode === 'fit') applyFit(); else applyManual(manualScale);
    paintZoom();
  });
  rfb.addEventListener('disconnect', (e) => {
    connected = false;
    msgEl.classList.remove('hidden');
    msgEl.textContent = (e.detail && e.detail.clean) ? '连接已断开，点“重连”恢复。' : '连接中断，点“重连”重试。';
    setStatus('已断开', 'err');
  });
  rfb.addEventListener('credentialsrequired', () => {
    const pwd = prompt('VNC 密码：') || '';
    rfb.sendCredentials({ password: pwd });
  });
  rfb.viewOnly = viewOnly;
  applyFit();
}

btnFit.addEventListener('click', applyFit);
btnOne.addEventListener('click', () => applyManual(1));
btnIn.addEventListener('click', () => step(0.1));
btnOut.addEventListener('click', () => step(-0.1));
btnCd.addEventListener('click', () => { if (rfb) rfb.sendCtrlAltDel(); });
btnFs.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});
btnReconnect.addEventListener('click', connect);

// 容器尺寸变化：适配模式交给 noVNC 自己重算，手动缩放要重新套用
let rafId = 0;
function onResize() {
  if (!rfb) return;
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(() => {
    if (mode === 'manual') {
      try { rfb._display.scale = manualScale; } catch (e) {}
    }
    paintZoom();
  });
}
window.addEventListener('resize', onResize);
try { new ResizeObserver(onResize).observe(screenEl); } catch (e) {}

connect();
</script>
</body>
</html>
