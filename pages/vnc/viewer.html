<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNC</title>
<style>
  :root { --bg: #0b0e17; }
  @media (prefers-color-scheme: light) { :root { --bg: #eef1f8; } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }
  #screen { position: absolute; inset: 0; background: var(--bg); }
  /* noVNC 自己套了一层 flex 容器，底色是 #282828（看起来就是黑边），滚动的也是它 */
  #screen > div {
    background: transparent !important;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  #screen > div::-webkit-scrollbar { width: 0; height: 0; }
  #screen.grab, #screen.grab > div, #screen.grab canvas { cursor: grab; }
  #screen.grab:active, #screen.grab > div:active, #screen.grab canvas:active { cursor: grabbing; }
  /* 放大时别再让 noVNC 用 margin:auto 居中，否则溢出部分会滑到左边滚不到 */
  #screen.grab canvas { margin: 0 auto !important; }
  #msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 20px; text-align: center; color: #8b93ab; pointer-events: none;
  }
  #msg.hidden { display: none; }
  #toast {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    padding: 5px 12px; border-radius: 999px; white-space: nowrap;
    background: rgba(16, 20, 32, .78); color: #e8eaf2; font-size: 12px;
    opacity: 0; transition: opacity .18s ease; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #reset {
    position: absolute; right: 10px; bottom: 10px; z-index: 5;
    height: 26px; padding: 0 11px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .18);
    background: rgba(16, 20, 32, .66); color: #e8eaf2;
    font: 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    cursor: pointer; opacity: .55; transition: opacity .15s ease;
  }
  #reset:hover { opacity: 1; }
  #reset.idle { opacity: .22; }
</style>
</head>
<body>
  <div id="screen"></div>
  <div id="msg">正在连接 VNC…</div>
  <div id="toast"></div>
  <button id="reset" title="回到满屏 100%">100%</button>

<script type="module">
import RFB from './core/rfb.js';

const screenEl = document.getElementById('screen');
const msgEl = document.getElementById('msg');
const toastEl = document.getElementById('toast');
const resetBtn = document.getElementById('reset');

const params = new URLSearchParams(location.search);
const host = params.get('host') || location.hostname;
const port = params.get('port') || '6080';
const path = params.get('path') || 'websockify';
const password = params.get('password') || '';
const viewOnly = params.get('view_only') === '1';

const ZOOM_STEP = 1.1;
const ZOOM_MAX = 3;
const RECONNECT_DELAY = 3000;

let rfb = null;
let mode = 'fit';          // fit | zoom
let zoomScale = 1;
let retryTimer = 0;
let toastTimer = 0;
let hinted = false;

function toast(text, ms) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  if (ms !== 0) toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 900);
}

function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${proto}://${host}:${port}/${path.replace(/^\/+/, '')}`;
}

function display() {
  return rfb && rfb._display;
}

function fitScale() {
  const d = display();
  if (!d || !d.width || !d.height) return 1;
  const w = screenEl.clientWidth;
  const h = screenEl.clientHeight;
  if (!w || !h) return 1;
  return Math.min(w / d.width, h / d.height);
}

function currentScale() {
  return mode === 'fit' ? fitScale() : zoomScale;
}

/** 真正滚动的是 noVNC 自己那层容器，不是 #screen */
function scrollEl() {
  return (rfb && rfb._screen) || screenEl;
}

/** 适应窗口：整块远程桌面完整可见（默认就是这个） */
function setFit() {
  mode = 'fit';
  if (rfb) {
    rfb.clipViewport = false;
    rfb.dragViewport = false;
    rfb.scaleViewport = true;
  }
  screenEl.classList.remove('grab');
  resetBtn.classList.add('idle');
  const s = scrollEl();
  s.scrollLeft = 0;
  s.scrollTop = 0;
}

/**
 * 缩放到 k，锚点是屏幕坐标 (clientX, clientY)。
 * k 不会低于“满屏 100%”；右下角按钮或 Esc 可以回去。
 */
function setZoom(k, clientX, clientY) {
  const d = display();
  if (!d || !d.width) return;
  const fit = fitScale();
  k = Math.min(ZOOM_MAX, Math.max(fit, k));
  if (k <= fit * 1.002) { setFit(); return; }

  const canvas = d._target;
  const s1 = currentScale();
  const rect1 = canvas.getBoundingClientRect();
  const ax = clientX == null ? screenEl.clientWidth / 2 : clientX;
  const ay = clientY == null ? screenEl.clientHeight / 2 : clientY;
  // 光标下的远程像素
  const remoteX = (ax - rect1.left) / s1;
  const remoteY = (ay - rect1.top) / s1;

  mode = 'zoom';
  zoomScale = k;
  rfb.scaleViewport = false;   // 关掉自适应后 noVNC 会把 display.scale 复位成 1
  rfb.clipViewport = false;
  try { d.scale = k; } catch (e) { /* 版本差异 */ }
  screenEl.classList.add('grab');
  resetBtn.classList.remove('idle');

  // 让同一个远程像素停在光标下
  const s = scrollEl();
  const rect2 = canvas.getBoundingClientRect();
  if (s.scrollWidth > s.clientWidth) s.scrollLeft += (rect2.left + remoteX * k) - ax;
  if (s.scrollHeight > s.clientHeight) s.scrollTop += (rect2.top + remoteY * k) - ay;
  toast(Math.round((k / fit) * 100) + '%');
}

function onWheel(e) {
  const zoomMod = e.ctrlKey || e.metaKey;
  if (zoomMod) {
    // 先无条件吃掉默认行为：否则浏览器会顺手把整个面板页面放大
    e.preventDefault();
    e.stopImmediatePropagation();
    if (!rfb) return;
    const factor = e.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP;
    setZoom(currentScale() * factor, e.clientX, e.clientY);
    return;
  }
  if (mode !== 'zoom') return;  // 满屏时滚轮交给远程页面
  e.preventDefault();           // 放大状态：滚轮平移视野
  e.stopImmediatePropagation();
  const s = scrollEl();
  s.scrollLeft += e.deltaX || (e.shiftKey ? e.deltaY : 0);
  s.scrollTop += e.shiftKey ? 0 : e.deltaY;
}

// ---------- 放大状态下平移 ----------
// 左键拖 = 平移（往右拖就看左边）；按下没动过就算点击，原样补发给远端
// 中键拖 = 平移
let gesture = null;
let pan = null;
let replaying = false;

function canvasEl() {
  return (rfb && rfb._display && rfb._display._target) || null;
}

function onMouseDown(e) {
  if (!rfb || replaying) return;
  if (mode !== 'zoom') return;              // 满屏状态：完全交给 noVNC
  if (e.button === 1) {                     // 中键
    e.preventDefault();
    e.stopPropagation();
    const s = scrollEl();
    pan = { x: e.clientX, y: e.clientY, l: s.scrollLeft, t: s.scrollTop };
    return;
  }
  if (e.button !== 0) return;
  e.stopPropagation();                      // 先别让远端收到，判定完再补发
  gesture = { x: e.clientX, y: e.clientY, moved: false };
}

function onMouseMove(e) {
  if (replaying) return;
  if (pan) {
    e.preventDefault();
    e.stopPropagation();
    const s = scrollEl();
    s.scrollLeft = pan.l - (e.clientX - pan.x);
    s.scrollTop = pan.t - (e.clientY - pan.y);
    return;
  }
  if (!gesture) return;
  const dx = e.clientX - gesture.x;
  const dy = e.clientY - gesture.y;
  if (!gesture.moved && Math.abs(dx) + Math.abs(dy) > 3) gesture.moved = true;
  if (gesture.moved) {
    e.preventDefault();
    e.stopPropagation();
    const s = scrollEl();
    s.scrollLeft -= dx;                     // 往右拖 -> 看到左边
    s.scrollTop -= dy;
    gesture.x = e.clientX;
    gesture.y = e.clientY;
  }
}

function onMouseUp(e) {
  if (replaying) return;
  if (pan) {
    pan = null;
    e.stopPropagation();
    return;
  }
  if (!gesture) return;
  const g = gesture;
  gesture = null;
  if (g.moved || e.button !== 0) {
    e.stopPropagation();
    return;
  }
  const c = canvasEl();
  if (!c) return;
  replaying = true;                         // 纯点击：补发给远端
  try {
    const base = { clientX: e.clientX, clientY: e.clientY, button: 0, bubbles: true, cancelable: true };
    c.dispatchEvent(new MouseEvent('mousemove', { ...base, buttons: 0 }));
    c.dispatchEvent(new MouseEvent('mousedown', { ...base, buttons: 1 }));
    c.dispatchEvent(new MouseEvent('mouseup', { ...base, buttons: 0 }));
  } finally {
    replaying = false;
  }
}

function connect() {
  clearTimeout(retryTimer);
  screenEl.innerHTML = '';
  mode = 'fit';
  msgEl.classList.add('hidden');
  if (rfb) {
    try { rfb.disconnect(); } catch (e) {}
    rfb = null;
  }
  try {
    rfb = new RFB(screenEl, wsUrl(), { credentials: { password }, wsProtocols: ['binary'] });
  } catch (e) {
    msgEl.classList.remove('hidden');
    msgEl.textContent = '初始化失败：' + (e && e.message ? e.message : e);
    return;
  }

  rfb.addEventListener('connect', () => {
    msgEl.classList.add('hidden');
    setFit();
    if (!hinted) {
      hinted = true;
      toast('Ctrl+滚轮缩放，放大后可拖动平移，右下角按钮回满屏', 2800);
    }
  });
  rfb.addEventListener('disconnect', (e) => {
    const clean = e.detail && e.detail.clean;
    msgEl.classList.remove('hidden');
    msgEl.textContent = clean ? '连接已断开，正在重连…' : '连接中断，正在重连…';
    toastEl.classList.remove('show');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, RECONNECT_DELAY);
  });
  rfb.addEventListener('credentialsrequired', () => {
    const pwd = prompt('VNC 密码：') || '';
    rfb.sendCredentials({ password: pwd });
  });
  rfb.viewOnly = viewOnly;
  setFit();
}

// Ctrl+滚轮缩放（捕获阶段拦下，别让浏览器把整个面板页面放大）
document.addEventListener('wheel', onWheel, { passive: false, capture: true });
screenEl.addEventListener('mousedown', onMouseDown, true);
window.addEventListener('mousemove', onMouseMove, true);
window.addEventListener('mouseup', onMouseUp, true);

// Esc 回到满屏
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && mode === 'zoom') { setFit(); toast('100%'); }
});

// 右下角按钮：回到满屏 100%
resetBtn.addEventListener('click', () => {
  setFit();
  toast('100%');
});

// 容器尺寸变化：放大状态重新套用缩放，适应状态重新算
let rafId = 0;
function onResize() {
  if (!rfb) return;
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(() => {
    if (mode === 'zoom') {
      try { rfb._display.scale = zoomScale; } catch (e) {}
    } else {
      setFit();
    }
  });
}
window.addEventListener('resize', onResize);
try { new ResizeObserver(onResize).observe(screenEl); } catch (e) {}

window.__vnc = {
  get rfb() { return rfb; },
  get mode() { return mode; },
  get scale() { return rfb ? rfb._display.scale : 0; },
};

connect();
</script>
</body>
</html>
