<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Win 调试</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171b2d;
    --text: #e8eaf2;
    --muted: #8b93ab;
    --line: #2a3050;
    --ok: #39d98a;
    --warn: #f7b955;
    --err: #ff6b6b;
    --accent: #4f7cff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef1f8;
      --panel: #ffffff;
      --text: #1b2030;
      --muted: #67708a;
      --line: #dfe4f2;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    display: flex; flex-direction: column;
  }
  .bar {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .title { font-weight: 700; font-size: 15px; white-space: nowrap; flex: none; }
  .status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); min-width: 0; flex: 0 1 auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--err); }
  .status span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1 1 auto; min-width: 0; }
  button {
    appearance: none; border: 1px solid var(--line); background: transparent;
    color: var(--text); padding: 6px 11px; border-radius: 8px; cursor: pointer;
    font: inherit; white-space: nowrap; flex: none;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .content {
    flex: 1 1 auto; min-height: 0; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 10px;
    padding: 24px; text-align: center; color: var(--muted);
  }
  .content strong { color: var(--text); font-size: 15px; }
  .modal {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 11, 20, .68); backdrop-filter: blur(4px); padding: 24px;
  }
  .modal.hidden { display: none; }
  .modal-box {
    width: min(360px, 88vw); background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 22px;
    display: flex; flex-direction: column; gap: 11px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, .45);
  }
  .modal-box h3 { margin: 0; font-size: 15px; }
  .modal-box p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
  .modal-box input {
    width: 100%; padding: 9px 11px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: inherit; outline: none;
  }
  .modal-box input:focus { border-color: var(--accent); }
  .modal-box button { width: 100%; padding: 9px; border: 0; border-radius: 7px; background: var(--accent); color: #fff; }
  .modal-box button:disabled { opacity: .55; cursor: not-allowed; }
  .err { min-height: 17px; color: var(--err); font-size: 12px; }
</style>
</head>
<body>
  <div class="bar">
    <div class="title">Win 调试</div>
    <div class="status"><i id="dot" class="dot"></i><span id="statusText">检测中…</span></div>
    <div class="spacer"></div>
    <button id="openBtn" class="primary" disabled>打开浏览器</button>
  </div>
  <div class="content">
    <strong>点击右上角「打开浏览器」启动 Chrome</strong>
    <div>登录完成后可直接关闭窗口，后台任务会自动恢复。</div>
  </div>

  <div id="login" class="modal hidden">
    <div class="modal-box">
      <h3>需要密码</h3>
      <p id="loginDesc">输入插件配置里的调试密码（vnc_password）后才能打开浏览器。</p>
      <input id="pwd" type="password" placeholder="调试密码" autocomplete="current-password">
      <button id="btnLogin">解锁</button>
      <div id="loginErr" class="err"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");
  const openBtn = document.getElementById("openBtn");
  const login = document.getElementById("login");
  const loginDesc = document.getElementById("loginDesc");
  const pwd = document.getElementById("pwd");
  const btnLogin = document.getElementById("btnLogin");
  const loginErr = document.getElementById("loginErr");

  let authEnabled = false;
  let token = "";
  let loading = false;

  function setStatus(text, kind) {
    statusText.textContent = text || "";
    dot.className = "dot" + (kind ? " " + kind : "");
  }
  function setError(text) {
    loginErr.textContent = text || "";
  }
  function showLogin(text) {
    openBtn.disabled = true;
    setStatus("需要密码", "warn");
    setError(text);
    login.classList.remove("hidden");
    setTimeout(() => { try { pwd.focus(); pwd.select(); } catch (e) {} }, 30);
  }
  function hideLogin() {
    login.classList.add("hidden");
    setError("");
  }
  function unwrap(resp) {
    if (!resp) return {};
    return resp.data || resp.result || resp;
  }
  function apiError(resp, data) {
    if (resp && resp.status === "error") return new Error(resp.message || "请求失败");
    if (data && data.ok === false) return new Error(data.error || "请求失败");
    return null;
  }
  async function waitBridge(ms) {
    const deadline = Date.now() + (ms || 5000);
    while (Date.now() < deadline) {
      const b = window.AstrBotPluginView || window.AstrBotPluginPage;
      if (b) return b;
      await new Promise((r) => setTimeout(r, 100));
    }
    return null;
  }
  async function call(path, method, body) {
    const bridge = await waitBridge(5000);
    if (!bridge) throw new Error("插件页桥接未加载，请刷新页面");
    if (bridge.ready) {
      await Promise.race([
        bridge.ready(),
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error("插件页桥接未就绪")), 6000)),
      ]);
    }
    const resp = method === "GET"
      ? await bridge.apiGet(path, {})
      : await bridge.apiPost(path, body || {});
    const data = unwrap(resp);
    const err = apiError(resp, data);
    if (err) throw err;
    return data || {};
  }

  async function refreshStatus() {
    try {
      const st = await call("winvnc/status", "GET");
      if (!st.supported) {
        setStatus("仅 Windows 需要", "warn");
        openBtn.disabled = true;
        return;
      }
      authEnabled = !!st.auth_enabled;
      if (authEnabled) {
        if (st.password_is_default) {
          loginDesc.textContent = "当前仍在使用公开的默认密码，建议先到插件配置修改。输入调试密码后才能打开浏览器。";
        }
        showLogin("");
      } else {
        openBtn.disabled = false;
        setStatus("就绪", "ok");
      }
    } catch (e) {
      openBtn.disabled = true;
      setStatus("检测失败", "err");
      showLogin(e && e.message ? e.message : "检测失败");
    }
  }

  async function doLogin() {
    const value = pwd.value;
    if (!value) {
      setError("密码不能为空");
      return;
    }
    btnLogin.disabled = true;
    setError("");
    try {
      const data = await call("winvnc/auth", "POST", { password: value });
      token = data.token || "";
      if (data.need_password && !token) throw new Error("没有拿到解锁凭据");
      authEnabled = !!data.need_password;
      pwd.value = "";
      hideLogin();
      openBtn.disabled = false;
      setStatus("已解锁", "ok");
    } catch (e) {
      setError(e && e.message ? e.message : "解锁失败");
      try { pwd.select(); } catch (err) {}
    } finally {
      btnLogin.disabled = false;
    }
  }

  async function openBrowser() {
    if (loading) return;
    if (authEnabled && !token) {
      showLogin("请先输入调试密码");
      return;
    }
    loading = true;
    openBtn.disabled = true;
    setStatus("正在启动 Chrome…", "warn");
    try {
      await call("winvnc/open", "POST", { token: token });
      setStatus("Chrome 调试窗口已启动", "ok");
    } catch (e) {
      const msg = e && e.message ? e.message : "启动失败";
      if (/过期|密码|登录/.test(msg)) {
        token = "";
        showLogin("登录已失效，请重新输入密码");
      } else {
        setStatus(msg, "err");
      }
    } finally {
      loading = false;
      openBtn.disabled = authEnabled && !token;
    }
  }

  btnLogin.addEventListener("click", doLogin);
  pwd.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
  openBtn.addEventListener("click", openBrowser);
  refreshStatus();
})();
</script>
</body>
</html>
